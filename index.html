<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfólio estilo jogo 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #info {
      position: absolute;
      top: 20px; left: 20px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      max-width: 300px;
      border-radius: 8px;
      display: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.151.3/build/three.min.js"></script>
  <script>

    // Setup da cena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x091921); // Fundo escuro estilo jogo

    // Câmera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    // Renderizador
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz ambiente e direcional
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5,10,7);
    scene.add(directionalLight);

    // Criar um "herói" (modelo básico)
    const heroGeometry = new THREE.BoxGeometry(1, 2, 1);
    const heroMaterial = new THREE.MeshStandardMaterial({color: 0x00aaff});
    const hero = new THREE.Mesh(heroGeometry, heroMaterial);
    hero.name = "Hero";
    hero.position.y = 1;
    scene.add(hero);

    // Plano chão
    const floorGeo = new THREE.PlaneGeometry(10, 10);
    const floorMat = new THREE.MeshStandardMaterial({color: 0x223344});
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Controle de clique para exibir info
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoDiv = document.getElementById('info');

    function onMouseClick(event) {
      // Converter posição do mouse para coordenadas normalizadas (-1 a +1)
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children);

      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.name === "Hero") {
          infoDiv.style.display = 'block';
          infoDiv.innerHTML = `<h2>Herói do Portfólio</h2>
            <p>Sou um personagem que representa seus projetos.</p>
            <ul>
              <li>Projeto 1: Desenvolvimento Web</li>
              <li>Projeto 2: Modelagem 3D</li>
              <li>Projeto 3: Animação</li>
            </ul>`;
        }
      } else {
        infoDiv.style.display = 'none';
      }
    }

    window.addEventListener('click', onMouseClick);

    // Animação do "herói"
    function animate() {
      requestAnimationFrame(animate);
      hero.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();

    // Redimensionamento da tela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
