<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portfólio - Djhessica</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .info {
      position: absolute;
      background: rgba(255,255,255,0.85);
      padding: 15px;
      border-radius: 8px;
      pointer-events: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    #sobre { top: 20px; left: 20px; }
    #contato { top: 20px; right: 20px; }
    #projetos { bottom: 20px; left: 20px; }
    #gostos { bottom: 20px; right: 20px; }
    a { color: #333; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="sobre" class="info">
      <h2>Sobre mim</h2>
      <p>Sou Djhessica, apaixonada por tecnologia, design e inovação. Gosto de criar experiências digitais únicas.</p>
    </div>
    <div id="contato" class="info">
      <h2>Contato</h2>
      <p><a href="mailto:seuemail@gmail.com">📧 Gmail</a></p>
      <p><a href="https://www.linkedin.com/in/seulinkedin" target="_blank">💼 LinkedIn</a></p>
    </div>
    <div id="projetos" class="info">
      <h2>Projetos</h2>
      <p><a href="https://github.com/seugit" target="_blank">🌐 GitHub</a></p>
    </div>
    <div id="gostos" class="info">
      <h2>Gostos</h2>
      <p>🎨 Arte digital<br>📚 Aprendizado contínuo<br>💻 Desenvolvimento web</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Cena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeaeaea);

    // Câmera
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(4, 3, 6);

    // Renderizador
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Controles
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Luz ambiente e direcional
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5,10,7);
    scene.add(dirLight);

    // Piso
    const floorGeometry = new THREE.PlaneGeometry(20,20);
    const floorMaterial = new THREE.MeshStandardMaterial({color:0xcccccc});
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    // Paredes
    const wallMaterial = new THREE.MeshStandardMaterial({color:0xffffff});
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20,10), wallMaterial);
    backWall.position.set(0,5,-10);
    scene.add(backWall);

    const sideWall = new THREE.Mesh(new THREE.PlaneGeometry(20,10), wallMaterial);
    sideWall.rotation.y = Math.PI/2;
    sideWall.position.set(-10,5,0);
    scene.add(sideWall);

    // Mesa
    const desk = new THREE.Mesh(new THREE.BoxGeometry(3,0.2,1.5), new THREE.MeshStandardMaterial({color:0x8B4513}));
    desk.position.set(0,1,0);
    scene.add(desk);

    // Pernas da mesa
    const legGeometry = new THREE.BoxGeometry(0.1,1,0.1);
    const legMaterial = new THREE.MeshStandardMaterial({color:0x5a2e0f});
    const legPositions = [[-1.4,0.5,-0.7],[1.4,0.5,-0.7],[-1.4,0.5,0.7],[1.4,0.5,0.7]];
    legPositions.forEach(pos=>{
      const leg = new THREE.Mesh(legGeometry, legMaterial);
      leg.position.set(...pos);
      scene.add(leg);
    });

    // Monitor
    const monitor = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.8,0.05), new THREE.MeshStandardMaterial({color:0x000000}));
    monitor.position.set(0,1.6,0);
    scene.add(monitor);

    // Cadeira
    const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(1,0.1,1), new THREE.MeshStandardMaterial({color:0x333333}));
    chairSeat.position.set(0,-0.2,2);
    scene.add(chairSeat);
    const chairBack = new THREE.Mesh(new THREE.BoxGeometry(1,1,0.1), new THREE.MeshStandardMaterial({color:0x333333}));
    chairBack.position.set(0,0.3,2.45);
    scene.add(chairBack);

    // Loop de animação
    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Responsividade
    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
