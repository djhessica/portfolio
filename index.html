<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portfólio - Djhessica</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .info {
      position: absolute;
      background: rgba(255,255,255,0.9);
      padding: 15px;
      border-radius: 8px;
      pointer-events: auto;
    }
    #sobre { top: 20px; left: 20px; }
    #contato { top: 20px; right: 20px; }
    #projetos { bottom: 20px; left: 20px; }
    #gostos { bottom: 20px; right: 20px; }
    a { color: #333; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="sobre" class="info">
      <h2>Sobre mim</h2>
      <p>Sou Djhessica, apaixonada por tecnologia, design e inovação. Gosto de criar experiências digitais únicas.</p>
    </div>
    <div id="contato" class="info">
      <h2>Contato</h2>
      <p><a href="mailto:seuemail@gmail.com">📧 Gmail</a></p>
      <p><a href="https://www.linkedin.com/in/seulinkedin" target="_blank">💼 LinkedIn</a></p>
    </div>
    <div id="projetos" class="info">
      <h2>Projetos</h2>
      <p><a href="https://github.com/seugit" target="_blank">🌐 GitHub</a></p>
    </div>
    <div id="gostos" class="info">
      <h2>Gostos</h2>
      <p>🎨 Arte digital<br>📚 Aprendizado contínuo<br>💻 Desenvolvimento web</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Cena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // Câmera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(3, 2, 5);

    // Renderizador
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Controles
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Luzes
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 0.8);
    pointLight.position.set(5,5,5);
    scene.add(pointLight);

    // Piso
    const floorGeometry = new THREE.PlaneGeometry(10,10);
    const floorMaterial = new THREE.MeshStandardMaterial({color:0xdddddd});
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    // Mesa
    const deskGeometry = new THREE.BoxGeometry(2,0.1,1);
    const deskMaterial = new THREE.MeshStandardMaterial({color:0x8B4513});
    const desk = new THREE.Mesh(deskGeometry, deskMaterial);
    desk.position.set(0,0.5,0);
    scene.add(desk);

    // Monitor
    const monitorGeometry = new THREE.BoxGeometry(0.8,0.5,0.05);
    const monitorMaterial = new THREE.MeshStandardMaterial({color:0x000000});
    const monitor = new THREE.Mesh(monitorGeometry, monitorMaterial);
    monitor.position.set(0,1,0);
    scene.add(monitor);

    // Loop de animação
    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Responsividade
    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
